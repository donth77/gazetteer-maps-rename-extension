# Daily breakage detection. The run FAILS only when the extension itself is
# broken: live-extension loads the built extension against real Google Maps
# and exits 1 when the hooks stopped rewriting. Everything else is a warning:
# a GNIS official-name change (means: update data/names.json soon, Google
# ships it within days) and Google challenge pages (infra noise; alerting on
# noise is how monitoring dies).
name: daily-health
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
jobs:
  gnis-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Poll GNIS for official-name changes
        run: |
          set +e
          node tools/gnis-watch.mjs
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::warning::GNIS official name changed. Google ships it within days: update data/names.json and data/gnis-watch.json."
          elif [ "$code" -eq 2 ]; then
            echo "::warning::GNIS endpoint unreachable (infra). Next run retries."
          fi
          exit 0
  live-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify hooks against live Google Maps
        run: |
          export CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          mkdir -p health-shots
          attempt() {
            set +e
            xvfb-run -a env HEADED=1 SHOT=health-shots/verify.png node tools/verify-live.mjs
            code=$?
            set -e
            return $code
          }
          if attempt; then exit 0; fi
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "First attempt hit infra noise; retrying once..."
            sleep 30
            if attempt; then exit 0; fi
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "::warning::Google challenged this runner twice (infra). Not alerting; next run retries."
              exit 0
            fi
          fi
          exit "$code"
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: health-shots
          path: health-shots/
          if-no-files-found: ignore
